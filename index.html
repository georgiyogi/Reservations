:root{--forest:#0E5655;--forest2:#3A7A78;--yellow:#E0DC8D;--yellow2:#CFCA74;--cream:#FFFDF7;--plum:#784963;--line:#E7E3C9;--muted:#5d7f7e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--forest);font-family:'Satoshi',system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}
header{background:var(--forest);color:var(--cream)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:18px;padding-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg{width:152px;height:36px;flex:none}
.brand b{font-size:15px;letter-spacing:.08em}
.tag{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--yellow)}
h1{font-family:'Kawit',serif;font-weight:400;font-size:clamp(64px,16vw,104px);line-height:.9;margin:36px 0 6px;letter-spacing:.01em}
.lead{font-family:'Garamond',serif;font-size:22px;line-height:1.25;margin:0 0 28px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:20px 20px}
.card+.card{margin-top:14px}
.hi{font-family:'Garamond',serif;font-size:26px;margin:0 0 4px}
.small{font-size:14px;color:var(--muted)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:var(--forest);border-radius:99px}

.btn{border:0;border-radius:99px;padding:11px 20px;font-weight:700;cursor:pointer;background:var(--forest);color:var(--cream);white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.plum{background:var(--plum)}

.btn.link{background:none;padding:6px 0;color:var(--plum);text-decoration:underline;border-radius:0}

.codebox input{text-transform:uppercase;letter-spacing:.08em}
.day{margin-top:26px}
.day h3{font-family:'Garamond',serif;font-weight:400;font-size:22px;margin:0 0 8px;padding-bottom:6px;border-bottom:1.5px solid var(--line)}
.cls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.cls .t{font-family:'Kawit',serif;font-size:34px;line-height:1;min-width:84px}
.cls .n{flex:1;min-width:0}
.cls .n b{display:block;font-size:16px}
.cls .n span{font-size:13px;color:var(--muted)}
.pill{font-size:13px;font-weight:700;border-radius:99px;padding:8px 14px;white-space:nowrap}
.pill.full{background:var(--line);color:var(--muted)}
.pill.mine{background:var(--yellow);color:var(--forest)}
.mine-list .cls .t{font-size:28px;min-width:70px}
.err{color:#9b2f2f;font-size:14px;margin-top:8px}
.empty{color:var(--muted);font-size:15px;margin:8px 0 0}
.loading{text-align:center;color:var(--muted);padding:40px 0}
.modal{position:fixed;inset:0;background:rgba(14,86,85,.45);display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}

.sheet h2{font-family:'Kawit',serif;font-weight:400;font-size:44px;line-height:.95;margin:0 0 6px}

.sheet .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

<main class="wrap">
  <h1>BOOK A CLASS</h1>
  <p class="lead">Practice from wherever you are, in small groups.</p>
  <div id="top"></div>
  <div id="list"><div class="loading">Loading classes…</div></div>
  <footer>Questions? <a href="https://wa.me/31621381906" target="_blank" rel="noopener">Message Georgi on WhatsApp</a> · <a href="https://georgiyogi.com" target="_top">georgiyogi.com</a></footer>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbygFd0JEeazgVL4ZH1SvOiQxIX_IecBbycPtP6bLY5lCDDdeNAtMLH0LZKfXiDmUJK6/exec';
var CODE = (new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z0-9-]/g, '');
try { if (!CODE) CODE = localStorage.getItem('gy_code') || ''; } catch (e) {}
var DATA = null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function dayLabel(iso){var d=new Date(iso+'T12:00:00Z');return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});}
function shortLabel(iso){var d=new Date(iso+'T12:00:00Z');return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});}
function run(fn,arg,ok,fail){
  var p = fn==='getData' ? fetch(API+'?api=1&code='+encodeURIComponent(arg||'')) :
    fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:fn},arg))});
  p.then(function(r){return r.json();}).then(function(j){ if(j.ok) ok(j.data); else fail(j.error||'Something went wrong. Please try again.'); })
   .catch(function(){ fail('Connection problem. Please try again.'); });
}

function load(){
  run('getData',CODE,function(d){
    DATA=d;
    if(d.codeInvalid){try{localStorage.removeItem('gy_code');}catch(e){} }
    else if(d.student){try{localStorage.setItem('gy_code',CODE);}catch(e){} }
    render();
  },function(m){document.getElementById('list').innerHTML='<p class="err">'+esc(m)+'</p>';});
}

function render(){
  var d=DATA, top=document.getElementById('top'), s=d.student, h='';
  if(s){
    var pct=s.included?Math.min(100,Math.round(s.used/s.included*100)):0;
    h+='<div class="card"><p class="hi">Hi, '+esc(s.name.split(' ')[0])+'</p>'+
       '<div class="small">'+esc(s.type)+(s.expires?' · valid until '+esc(s.expires):'')+'</div>'+
       '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
       '<div class="row" style="justify-content:space-between"><b>'+s.used+' of '+s.included+' classes used</b><span class="small">'+s.left+' left</span></div></div>';
    h+='<div class="card mine-list"><p class="label">Your booked classes ('+d.mine.length+')</p>';
    if(!d.mine.length) h+='<p class="empty">No classes booked yet. Choose one below.</p>';
    d.mine.forEach(function(m,i){
      h+='<div class="cls"><div class="t">'+esc(m.time)+'</div><div class="n"><b>'+esc(m.name)+'</b><span>'+esc(shortLabel(m.date))+'</span></div><button class="btn ghost" onclick="askCancel('+i+')">Cancel</button></div>';
    });
    h+='<p class="small" style="margin:10px 0 0">You can cancel up to '+d.cancelHours+' hours before class.</p></div>';
    h+='<p class="small" style="margin:10px 0 0">Not '+esc(s.name.split(' ')[0])+'? <button class="btn link" onclick="signOut()">Use another code</button></p>';
  } else {
    h+='<div class="card"><p class="label">Have a student code?</p><div class="codebox"><input type="text" id="codeIn" placeholder="GY-XXXX" autocomplete="off" value="'+esc(d.codeInvalid?CODE:'')+'"><button class="btn" onclick="useCode()">Enter</button></div>'+
       (d.codeInvalid?'<p class="err">We couldn\'t find that code. Check it or message Georgi.</p>':'')+'</div>';
    h+='<div class="card"><p class="label">New here?</p><p style="margin:0;font-family:Garamond,serif;font-size:20px;line-height:1.3">Book your <b style="font-family:Satoshi">trial class</b>: 75 minutes, €14. Pick any class below.</p></div>';
  }
  top.innerHTML=h;
  var ci=document.getElementById('codeIn'); if(ci) ci.addEventListener('keydown',function(e){if(e.key==='Enter')useCode();});

  var mineKeys={}; (d.mine||[]).forEach(function(m){mineKeys[m.date+'|'+m.time+'|'+m.name]=1;});
  var L='', last='';
  if(!d.classes.length) L='<p class="empty" style="margin-top:24px">No classes scheduled right now. Message Georgi on WhatsApp.</p>';
  d.classes.forEach(function(c,i){
    if(c.date!==last){ if(last) L+='</div>'; L+='<div class="day"><h3>'+esc(dayLabel(c.date))+'</h3>'; last=c.date; }
    var k=c.date+'|'+c.time+'|'+c.name, full=c.taken>=c.cap, act;
    if(mineKeys[k]) act='<span class="pill mine">Booked ✓</span>';
    else if(full) act='<span class="pill full">Full</span>';
    else act='<button class="btn plum" onclick="askBook('+i+')">Book</button>';
    L+='<div class="cls"><div class="t">'+esc(c.time)+'</div><div class="n"><b>'+esc(c.name)+'</b><span>'+c.taken+'/'+c.cap+' spots taken</span></div>'+act+'</div>';
  });
  if(last) L+='</div>';
  document.getElementById('list').innerHTML=L;
}

function useCode(){var v=(document.getElementById('codeIn').value||'').trim().toUpperCase();if(!v)return;CODE=v;document.getElementById('list').innerHTML='<div class="loading">Loading…</div>';load();}
function signOut(){CODE='';try{localStorage.removeItem('gy_code');}catch(e){}load();}

var modal=document.getElementById('modal'), sheet=document.getElementById('sheet');
function openM(h){sheet.innerHTML=h;modal.classList.add('on');}
function closeM(){modal.classList.remove('on');}
modal.addEventListener('click',function(e){if(e.target===modal)closeM();});

function askBook(i){
  var c=DATA.classes[i], s=DATA.student;
  var h='<h2>'+esc(c.name.indexOf('Ashtanga')===0?'ASHTANGA':c.name.toUpperCase())+'</h2><p class="when">'+esc(dayLabel(c.date))+' · '+esc(c.time)+'</p>';
  if(s){
    h+='<p style="margin:0">This uses 1 class of your '+esc(s.type)+'. You\'ll have '+(s.left-1)+' left.</p>';
  } else {
    h+='<p style="margin:0 0 4px">Your trial class: 75 minutes, €14.</p>'+
       '<label for="fName">Name *</label><input type="text" id="fName" autocomplete="name">'+
       '<label for="fPhone">WhatsApp number *</label><input type="tel" id="fPhone" autocomplete="tel" inputmode="tel" oninput="this.value=this.value.replace(/[^\\d+]/g,\'\')">'+
       '<label for="fEmail">Email (optional, for a confirmation)</label><input type="email" id="fEmail" autocomplete="email">'+
       '<label for="fNotes">Anything I should know? (optional)</label><textarea id="fNotes" rows="2"></textarea>';
  }
  h+='<div id="mErr" class="err"></div><div class="actions"><button class="btn ghost" onclick="closeM()">Back</button><button class="btn plum" id="go" onclick="doBook('+i+')">Book my spot</button></div>';
  openM(h);
}

function doBook(i){
  var c=DATA.classes[i], f={date:c.date,time:c.time,cls:c.name,code:DATA.student?CODE:''};
  if(!DATA.student){f.name=val('fName');f.phone=val('fPhone');f.email=val('fEmail');f.notes=val('fNotes');}
  var b=document.getElementById('go'); b.disabled=true; b.textContent='Booking…';
  run('book',f,function(r){
    var h='<h2>YOU\'RE IN!</h2><p class="when">'+esc(r.cls)+' · '+esc(r.when)+'</p><p class="ok">I\'ll send you the class link on WhatsApp before we start. See you on the mat.</p>';
    if(r.trial&&r.tikkie) h+='<div class="actions"><a class="btn plum" style="text-decoration:none" href="'+esc(r.tikkie)+'" target="_blank" rel="noopener">Pay €14 with Tikkie</a></div>';
    if(r.renew) h+='<p style="margin:12px 0 0;font-size:15px"><b>Heads up:</b> after this one you have <b>1 class left</b> on your pass. Message Georgi on WhatsApp to renew.</p>';
    h+='<div class="actions"><button class="btn ghost" onclick="closeM();load()">Done</button></div>';
    openM(h);
  },function(m){document.getElementById('mErr').textContent=m;b.disabled=false;b.textContent='Book my spot';});
}

function askCancel(i){
  var m=DATA.mine[i];
  openM('<h2>CANCEL?</h2><p class="when">'+esc(m.name)+' · '+esc(dayLabel(m.date))+' · '+esc(m.time)+'</p><p style="margin:0">The class goes back to your pass.</p><div id="mErr" class="err"></div><div class="actions"><button class="btn ghost" onclick="closeM()">Keep it</button><button class="btn plum" id="go" onclick="doCancel('+i+')">Cancel class</button></div>');
}
function doCancel(i){
  var m=DATA.mine[i], b=document.getElementById('go'); b.disabled=true; b.textContent='Cancelling…';
  run('cancel',{code:CODE,date:m.date,time:m.time,cls:m.name},function(){closeM();load();},function(e){document.getElementById('mErr').textContent=e;b.disabled=false;b.textContent='Cancel class';});
}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}

load();
</script>
</body>
</html>
